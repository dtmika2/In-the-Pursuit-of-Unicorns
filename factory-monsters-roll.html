<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>In the Pursuit of Unicorns — Factory Inhabitants and Employees</title>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fxWhite{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@keyframes fxPulse{0%{filter:brightness(1)}50%{filter:brightness(3)}100%{filter:brightness(1)}}

:root{
  --bg:#0a0a0a;
  --surface:#141414;
  --highlight:#dcdcdc;
  --text:#c4c4c4;
  --muted:#666666;
  --dim:#999999;
  --accent:#8c8c8c;
  --accent-dim:rgba(170,170,170,.25);
  --accent-glow:rgba(180,180,180,.16);
}

html{scroll-behavior:smooth}

body{
  background:var(--bg);
  font-family:'Syncopate',sans-serif;
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}

#stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

.wrap{
  position:relative;z-index:1;
  max-width:860px;width:100%;
  padding:4rem 1.5rem 5rem;
  text-align:center;
  animation:fadeUp .8s ease both;
}

.hd-title{
  font-family:'Syncopate',sans-serif;
  font-size:clamp(1.6rem,6vw,2.8rem);
  font-weight:700;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--accent);
  text-shadow:0 0 80px rgba(180,180,180,.3);
  line-height:1.3;
}

.hd-sub{
  margin-top:.55rem;
  font-size:.7rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:#707070;
}

.divider{
  width:120px;
  height:1px;
  background:linear-gradient(to right,transparent,var(--accent),transparent);
  margin:2.5rem auto;
  opacity:.5;
}

#categories{
  display:flex;
  flex-direction:column;
  gap:1.5rem;
}

.cat-block{
  background:var(--surface);
  border:1px solid var(--accent-dim);
  border-radius:2px;
  padding:1.6rem 2rem;
  transition:border-color .25s,box-shadow .25s;
}

.cat-btn{
  display:block;
  width:100%;
  min-width:160px;
  background:none;
  border:none;
  border-radius:6px;
  padding:1rem 1.5rem;
  font-family:'Syncopate',sans-serif;
  font-size:.95rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--text);
  cursor:pointer;
  transition:box-shadow .25s,transform .2s,color .2s;
}
.cat-btn:hover{
  box-shadow:0 0 28px var(--accent-glow);
  transform:translateY(-2px);
}
.cat-btn.active{
  box-shadow:0 0 18px var(--accent-glow);
  color:var(--highlight);
}

.reel{
  margin-top:1.25rem;
  animation:fadeUp .5s ease both;
}

.reel-frame{
  position:relative;
  width:min(100%,512px);
  aspect-ratio:2/3;
  margin:0 auto;
  border:1px solid var(--accent-dim);
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 0 28px var(--accent-glow);
  background:#000;
}

.reel-img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
  z-index:1;
  filter:saturate(.45);
}
.reel-img.fx-invert{filter:invert(1) brightness(1.4)}
.reel-img.fx-pulse{animation:fxPulse .2s ease-in-out}

.reel-flash{
  position:absolute;inset:0;
  z-index:2;
  pointer-events:none;
  opacity:0;
  background:transparent;
}
.reel-flash.fx-white{
  background:#fff;
  animation:fxWhite .2s ease-in-out;
}

.reel-black{
  position:absolute;inset:0;
  z-index:3;
  pointer-events:none;
  background:#000;
  opacity:0;
  transition:opacity .35s ease;
}
.reel-black.show{opacity:1}

.reel-whiteout{
  position:absolute;inset:0;
  z-index:4;
  pointer-events:none;
  background:#fff;
  opacity:0;
  transition:opacity .3s ease;
}
.reel-whiteout.show{opacity:1}

.back{
  display:inline-block;
  margin-top:2.5rem;
  font-size:.7rem;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);
  text-decoration:none;
  transition:color .2s;
}
.back:hover{color:var(--dim)}

@media(min-width:1024px){html{font-size:120%}}

@media(max-width:560px){
  .cat-block{padding:1.2rem 1.25rem}
  #categories{gap:1rem}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="wrap">
  <h1 class="hd-title">Factory Inhabitants and Employees</h1>
  <p class="hd-sub">Random Encounter Generator</p>

  <div class="divider"></div>

  <div id="categories"></div>

  <a class="back" href="dm.html">← back to dm cabinet</a>
</div>

<script>
(function(){
  const canvas=document.getElementById('stars');
  const ctx=canvas.getContext('2d');
  let stars=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
  function init(){
    resize();stars=[];
    for(let i=0;i<160;i++){
      const r=Math.random()*1.1+.2;
      stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r,
        op:Math.random(),spd:.004+Math.random()*.008,dir:Math.random()>.5?1:-1});
    }
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const s of stars){
      s.op+=s.spd*s.dir;
      if(s.op>=.75||s.op<=.06)s.dir*=-1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${s.op})`;ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',init);
  init();draw();
})();
</script>

<script>
(function(){
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const lerp = (a, b, t) => a + (b - a) * t;

  function genFiles(prefix, count) {
    const arr = [];
    for (let i = 1; i <= count; i++) {
      arr.push('Images/Factory%20Monsters/' + prefix + '%20' + String(i).padStart(2, '0') + '.png');
    }
    return arr;
  }

  const CATS = [
    { key: 'janitors',  label: 'Janitors',  pool: genFiles('Janitors', 5) },
    { key: 'smokers',   label: 'Smokers',   pool: genFiles('Smokers', 8) },
    { key: 'freak',     label: 'Freaks',    pool: genFiles('Freak', 6) },
    { key: 'formans',   label: 'Formans',   pool: genFiles('Formans', 15) },
    { key: 'scientist', label: 'Scientist', pool: genFiles('Scientist', 9) },
  ];

  const EFFECTS = ['fx-white', 'fx-invert', 'fx-pulse'];

  function pickNext(pool, lastSrc) {
    if (pool.length === 1) return pool[0];
    let next;
    do { next = pool[Math.floor(Math.random() * pool.length)]; } while (next === lastSrc);
    return next;
  }

  function buildReel(cat) {
    const block = document.createElement('div');
    block.className = 'cat-block';

    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.type = 'button';
    btn.textContent = cat.label;

    const reelEl = document.createElement('div');
    reelEl.className = 'reel';
    reelEl.hidden = true;

    const frame = document.createElement('div');
    frame.className = 'reel-frame';

    const img = document.createElement('img');
    img.className = 'reel-img';
    img.alt = cat.label;

    const flash = document.createElement('div');
    flash.className = 'reel-flash';

    const black = document.createElement('div');
    black.className = 'reel-black';

    const whiteout = document.createElement('div');
    whiteout.className = 'reel-whiteout';

    frame.appendChild(img);
    frame.appendChild(flash);
    frame.appendChild(black);
    frame.appendChild(whiteout);
    reelEl.appendChild(frame);
    block.appendChild(btn);
    block.appendChild(reelEl);

    const reel = {
      pool: cat.pool,
      running: false,
      gen: 0,
      el: reelEl,
      img, flash, black, whiteout, btn,
      lastSrc: null,
    };

    btn.addEventListener('click', () => {
      if (reel.running) {
        reel.running = false;
        btn.classList.remove('active');
        reelEl.hidden = true;
        resetVisuals(reel);
      } else {
        reel.running = true;
        reel.gen += 1;
        btn.classList.add('active');
        reelEl.hidden = false;
        runReel(reel, reel.gen);
      }
    });

    return block;
  }

  function resetVisuals(reel) {
    reel.flash.classList.remove('fx-white');
    reel.img.classList.remove('fx-invert', 'fx-pulse');
    reel.black.classList.remove('show');
    reel.whiteout.classList.remove('show');
  }

  async function fireFlash(reel) {
    const fx = EFFECTS[randInt(0, EFFECTS.length - 1)];
    const target = fx === 'fx-white' ? reel.flash : reel.img;
    target.classList.add(fx);
    await sleep(randInt(120, 260));
    target.classList.remove(fx);
  }

  // Brief, non-blocking flicker fired during the spin itself, so effects
  // aren't only ever seen after the reel has settled.
  function triggerQuickEffect(reel) {
    const fx = EFFECTS[randInt(0, EFFECTS.length - 1)];
    const target = fx === 'fx-white' ? reel.flash : reel.img;
    target.classList.add(fx);
    setTimeout(() => target.classList.remove(fx), randInt(80, 160));
  }

  async function dipWhite(reel) {
    reel.whiteout.classList.add('show');
    await sleep(300);
    await sleep(randInt(80, 180));
    reel.whiteout.classList.remove('show');
    await sleep(300);
  }

  // A handful of ticks easing from fast to slow, like one deceleration pass
  // of the reel. Used both for the main spin-down and for the short
  // re-acceleration bursts of a "fake" halt.
  async function doTicks(reel, myGen, count) {
    for (let i = 0; i < count; i++) {
      if (!(reel.running && reel.gen === myGen)) return false;
      const next = pickNext(reel.pool, reel.lastSrc);
      reel.lastSrc = next;
      reel.img.src = next;
      if (Math.random() < 0.1) triggerQuickEffect(reel);
      const delay = lerp(45, 550, Math.pow(i / count, 2));
      await sleep(delay);
    }
    return true;
  }

  // Spin down to an apparent halt, but sometimes pick back up speed and
  // decelerate again one or more times before truly settling.
  async function spinToHalt(reel, myGen) {
    if (!(await doTicks(reel, myGen, randInt(18, 30)))) return false;
    let fakeChance = 0.15;
    while (Math.random() < fakeChance) {
      if (!(reel.running && reel.gen === myGen)) return false;
      if (!(await doTicks(reel, myGen, randInt(10, 18)))) return false;
      fakeChance *= 0.4;
    }
    return true;
  }

  // Negative afterimage, like the still frame left behind after a
  // lightning strike: negate, dip to white, return the halted image,
  // dip to white again, return the image, then resume rolling.
  async function lightningSequence(reel, myGen) {
    const alive = () => reel.running && reel.gen === myGen;

    reel.img.classList.add('fx-invert');
    await sleep(randInt(150, 300));
    if (!alive()) return false;

    await dipWhite(reel);
    if (!alive()) return false;

    reel.img.classList.remove('fx-invert');
    await sleep(randInt(300, 700));
    if (!alive()) return false;

    await dipWhite(reel);
    if (!alive()) return false;

    await sleep(randInt(200, 400));
    return alive();
  }

  async function runReel(reel, myGen) {
    const alive = () => reel.running && reel.gen === myGen;
    while (alive()) {
      // SPIN (with occasional fake halts)
      if (!(await spinToHalt(reel, myGen))) return;
      if (!alive()) return;

      // HOLD
      await sleep(randInt(1500, 3000));
      if (!alive()) return;

      // FLASH(ES) — usually a quick double flash, sometimes the longer
      // lightning afterimage sequence instead.
      if (Math.random() < 0.3) {
        if (!(await lightningSequence(reel, myGen))) return;
      } else {
        await fireFlash(reel);
        if (!alive()) return;
        await fireFlash(reel);
        if (!alive()) return;
      }

      // BLACKOUT
      reel.black.classList.add('show');
      await sleep(350);
      await sleep(randInt(250, 700));
      const next = pickNext(reel.pool, reel.lastSrc);
      reel.lastSrc = next;
      reel.img.src = next;
      reel.black.classList.remove('show');
      await sleep(350);
      if (!alive()) return;
    }
  }

  const container = document.getElementById('categories');
  CATS.forEach(cat => container.appendChild(buildReel(cat)));
})();
</script>
</body>
</html>
