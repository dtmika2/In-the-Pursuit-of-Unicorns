<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>In the Pursuit of Unicorns - Gear</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

:root{
  --bg:#04040f;
  --surface:#09091a;
  --gold:#c9a84c;
  --text:#d4c9a8;
  --muted:#5a5044;
  --dim:#8a7e64;
}

html{scroll-behavior:smooth}

body{
  background:var(--bg);
  font-family:'EB Garamond',serif;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

#stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

.wrap{
  position:relative;z-index:1;
  max-width:900px;margin:0 auto;
  padding:3rem 1.25rem 5rem;
  animation:fadeUp .5s ease both;
}

.hd{text-align:center;margin-bottom:2.5rem}
.hd-title{
  font-family:'Cinzel',serif;
  font-size:clamp(1.9rem,5vw,2.8rem);
  font-weight:700;letter-spacing:.14em;
  color:var(--gold);
  text-shadow:0 0 60px rgba(201,168,76,.28);
}
.hd-sub{
  margin-top:.4rem;
  font-size:.72rem;letter-spacing:.32em;
  text-transform:uppercase;color:#6c6052;
}

.back{
  display:inline-block;
  font-size:.7rem;letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--muted);text-decoration:none;
  transition:color .2s;
}
.back:hover{color:var(--dim)}
.back-top{margin-bottom:1.75rem;display:block}
.back-bot{margin-top:2.5rem;display:inline-block}

.placeholder{
  background:var(--surface);
  border:1px solid rgba(255,255,255,.055);
  border-radius:6px;
  padding:2.5rem 1.5rem;
  text-align:center;
  color:var(--dim);
  font-style:italic;
}
@media(min-width:1024px){html{font-size:120%}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="wrap">
  <a class="back back-top" href="starter-equipment.html">← back to starter equipment</a>

  <div class="hd">
    <h1 class="hd-title">Gear</h1>
    <p class="hd-sub">Tools, supplies &amp; the rest of the pack</p>
  </div>

  <div class="placeholder">Content coming soon…</div>

  <a class="back back-bot" href="starter-equipment.html">← back to starter equipment</a>
</div>

<script>
(function(){
  const canvas=document.getElementById('stars');
  const ctx=canvas.getContext('2d');
  let stars=[];
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
  function init(){
    resize();stars=[];
    for(let i=0;i<160;i++){
      const r=Math.random()*1.1+.2;
      stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r,
        op:Math.random(),spd:.004+Math.random()*.008,dir:Math.random()>.5?1:-1});
    }
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const s of stars){
      s.op+=s.spd*s.dir;
      if(s.op>=.75||s.op<=.06)s.dir*=-1;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${s.op})`;ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',init);
  init();draw();
})();
</script>
</body>
</html>
